name: Partner guide
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Compile the actual guide examples
        run: |
          if [ -f go.mod ]; then
            python3 scripts/check-docs.py
          else
            # Keep this pin aligned with online-docs.md until the runtime PR reaches main.
            python3 scripts/check-docs.py 94c69e0e6933795d33a34dc06759632da1fe5895
          fi
