services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - data_v16:/var/lib/postgresql/data
  mock_server:
    build:
      context: ../mock_api_server
    environment:
      HTTP_PORT: "8080"
      GIN_MODE: release
    ports:
      - "127.0.0.1:8181:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
  nakama:
    build:
      context: ..
      dockerfile: plugin/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mock_server:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama?sslmode=disable &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama?sslmode=disable
    ports:
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
  nakama-test-client:
    profiles: [clients]
    build:
      context: ../nakama_test_client/src
    environment:
      NAKAMA_URL: http://nakama:7350
    depends_on:
      nakama:
        condition: service_healthy
volumes:
  data_v16:
