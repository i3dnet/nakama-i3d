services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: local-test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 1s
      timeout: 3s
      retries: 30
  nakama:
    ports:
      - "127.0.0.1::7350"
    build:
      context: ..
      dockerfile: plugin/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        /nakama/nakama migrate up --database.address postgres:local-test@postgres:5432/nakama?sslmode=disable &&
        exec /nakama/nakama --runtime.http_key local-test --config /nakama/data/local.yml --database.address postgres:local-test@postgres:5432/nakama?sslmode=disable
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
