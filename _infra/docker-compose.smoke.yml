services:
  mock_server:
    build:
      context: ../mock_api_server
    environment:
      HTTP_PORT: "8080"
      GIN_MODE: release
      MOCK_PAGE_SIZE: "1"
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 3s
      retries: 30
  nakama:
    build:
      args:
        PLUGIN_BUILD_TAGS: i3d_smoke
    volumes:
      - ./local.smoke.yml:/nakama/data/local.yml:ro
    depends_on:
      mock_server:
        condition: service_healthy
